packages:
  - packages/*
  - apps/zcode-cli
  - apps/zcode-cli/packages/*
  - apps/zcode-cli/tools/*
  - apps/zcode-tauri
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
# pnpm 10 reads these from pnpm-workspace.yaml; the matching package.json "pnpm" field is no
# longer read and was migrated here so the react pin and the two @ai-sdk patches are not silently
# dropped on the next config-resolving install.
overrides:
  react: 19.2.7
  react-dom: 19.2.7
patchedDependencies:
  '@ai-sdk/anthropic@3.0.81': patches/@ai-sdk__anthropic@3.0.81.patch
  '@ai-sdk/openai-compatible@2.0.60': patches/@ai-sdk__openai-compatible@2.0.60.patch
