# Manual diagnostic: boot `pnpm dev:tauri` on a clean runner and surface the ACTUAL
# failure in the workflow log.
#
# WHY THIS EXISTS. `build.yml` proves `tauri build` compiles on every target, but
# compiling is not booting: `pnpm dev:tauri` additionally boots `@zcode/server` (:3030),
# starts Vite (:5199 via tauri.conf.json beforeDevCommand), compiles the debug Rust
# host, and launches the app exe with WebView2. On Windows each of those stages can
# fail independently (missing WebView2 runtime, MSVC-only compile errors, missing
# `.node` binaries for the server) and today no CI surface reproduces that sequence —
# so a Windows boot failure stays a local mystery. This workflow boots the real
# command and prints the transcript; the supervisor script decides pass/fail from
# port + process signals, not from guesses.
#
# Spec: docs/specs/tauri-dev-simulate.md
#
# MANUAL ONLY (`workflow_dispatch`): a dev boot needs a long cold cargo debug compile
# and is a diagnostic, not a push/PR gate. Both matrix rows run on every dispatch so
# the Windows row (the failing platform) can be compared against Linux.
name: tauri-dev-simulate

on:
  workflow_dispatch:
    inputs:
      boot_timeout_seconds:
        description: "Seconds to wait for the full boot (cargo debug compile can be slow on a cold cache)"
        required: false
        default: "1800"
      stabilize_seconds:
        description: "Seconds all boot signals must stay healthy before the run counts as booted"
        required: false
        default: "45"

# Never cancel an in-flight diagnostic mid-boot: the value of the run is the
# complete transcript, and a partially torn-down boot hides the real error.
concurrency:
  group: tauri-dev-simulate-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same pins as ci.yml / build.yml / mise.toml — the simulation must boot the same
  # toolchain the gates and releases use.
  PNPM_VERSION: "10.33.2"
  NODE_VERSION: "24.14.0"
  BOOT_TIMEOUT_SECONDS: ${{ inputs.boot_timeout_seconds }}
  STABILIZE_SECONDS: ${{ inputs.stabilize_seconds }}

jobs:
  dev-boot:
    name: "dev:tauri boot ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform's failure must not hide the other's transcript — comparing the
      # two is how a Windows-specific cause is isolated.
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, platform: win32-x64 }
          - { runner: ubuntu-22.04, platform: linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/rust
            apps/zcode-tauri/src-tauri
          key: tauri-dev-${{ matrix.platform }}

      # Same WebKitGTK/bundler deps as build.yml — the Linux row must boot on the same
      # system packages a real Linux desktop provides. `xvfb` supplies the virtual
      # display: GitHub's Linux runners are headless, and without one GTK cannot
      # initialize — tao panics with "Failed to initialize gtk backend" the moment the
      # compiled app launches (run 37050820634).
      # 中文：GitHub 的 Linux runner 无显示服务器，GTK 无法初始化，tao 直接
      # panic（"Failed to initialize gtk backend"）—— 必须用 Xvfb 虚拟显示。
      - name: Install Linux WebKitGTK deps
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            xvfb

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # `@zcode/server` loads compiled Rust napi binaries from packages/rust at boot;
      # without them the server stage fails before the app even compiles. Staging them
      # first means a boot failure is a boot failure, not a missing-artifact one.
      - name: Build and stage native crates
        run: pnpm --filter @zcode/rust build:native

      # The real command, supervised: spawns `pnpm dev:tauri`, watches :3030 (server),
      # :5199 (vite) and the app process, tears the tree down, prints the log tail on
      # failure. Exit code 1 = the dev boot did not come up. On Linux the whole thing
      # runs under `xvfb-run` so the GUI app has a display to open a window on;
      # Windows runners have a real desktop session and need no wrapper.
      # 中文：Linux 下用 xvfb-run 包裹以提供虚拟显示；Windows runner 自带
      # 桌面会话，直接运行。
      - name: "Simulate pnpm dev:tauri"
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node scripts/ci-dev-tauri-simulate.mjs
          else
            node scripts/ci-dev-tauri-simulate.mjs
          fi

      # The full boot transcript survives a failed run — that transcript is the point
      # of this workflow (it names the failing stage: server / vite / cargo / app).
      - name: Upload dev boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-tauri-log-${{ matrix.platform }}
          path: dev-tauri-ci.log
          if-no-files-found: warn
