name: platform-build-and-test

# Cross-platform verification for the Tauri desktop app on Linux + Windows.
# (macOS is intentionally not run: no macos runner is in any matrix in this repo's CI, so the
#  darwin targets are neither built nor tested here. See the matrix comments in each workflow.)
#
# GOAL: reveal EXACTLY which platform and which step fails. To that end:
#   - `test` job runs on BOTH OSes with `fail-fast: false` (one OS failing never cancels the other)
#     and AGGREGATES every check into one pass/fail table, so a single run reports ALL failures for
#     that platform, not just the first (hard gates fail the job; advisory checks are reported only).
#   - `build` job builds the real app bundle per OS; on Linux it additionally produces an AppImage
#     (`--config '{"bundle":{"active":true}}' --bundles appimage`) because the dev tauri.conf.json
#     ships with `bundle.active:false`. It also builds the gitignored `zcode-echo` sidecar first,
#     otherwise the bundler aborts on the missing externalBin file.
#
# NOTE: the Tauri shell is an explicit WIP port ("NOT yet feature-complete"); a failing build/bundle
# step here is a FEATURE of the workflow — it names the precise platform + stage that is not ready.
#
# TRIGGER: manual (workflow_dispatch) — always; `push` — tests + build; `pull_request` — tests only
# (the heavy per-OS app bundle is skipped on PRs; force it with run_build on a dispatch).

# CURRENT SCOPE — linux-x64 AppImage + windows-x64 **portable** (no installer).
# Windows is built as a portable folder (ZCode.exe + host/) precisely because that needs no
# Authenticode certificate. macOS is NOT built or tested anywhere in this repo's CI (all darwin
# matrix entries were removed), even though the addons still ship for darwin — see the notes in
# zcode-db-native.yml / zcode-pty-native.yml.
# A Windows *installer* (MSI/NSIS) would still need the signing secrets this repo does not have;
# to add one, re-add a matrix entry with `bundles: msi` and supply `TAURI_SIGNING_*`/cert secrets.
# `runner.os == 'Linux'` guards on the WebKitGTK step keep the Linux-only apt deps off other runners.
on:
  workflow_dispatch:
    inputs:
      run_build:
        description: "Also run the Linux/Windows app bundle (+ Linux AppImage) build"
        type: boolean
        required: false
        default: true
      cargo_verbose:
        description: "Pass -vv to cargo and --nocapture to test runners"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
      - remove-electron-tauri-default
  pull_request:
    branches:
      - main
      - remove-electron-tauri-default

concurrency:
  group: platform-build-and-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Tauri v2 + WebKitGTK/AppImage compile-time deps for the ubuntu-24.04 runner.
  # Source: packages/desktop/tauri-port/CI-PACKAGING.md §2.1 (Tauri v2 Linux docs) + patchelf
  # (AppImage tooling) + pkg-config/libglib2.0-dev (glib build).
  LINUX_TAURI_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev patchelf libglib2.0-dev pkg-config

jobs:
  # ---------------------------------------------------------------------------
  # 1. All checks + all tests, per OS, aggregated into one report per platform.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-24.04
          - label: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # bash on every OS (Windows runners ship Git Bash) so identical commands behave the same.
    defaults:
      run:
        shell: bash
    env:
      VERBOSE_FLAG: ${{ github.event.inputs.cargo_verbose == true && '--nocapture' || '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: "[linux] install Tauri/WebKitGTK + AppImage build deps"
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_TAURI_DEPS

      - name: "[diag] toolchain"
        run: |
          echo "uname: $(uname -a)"
          echo "node:  $(node -v)"
          echo "pnpm:  $(pnpm -v)"
          echo "rustc: $(rustc -vV | tr '\n' ' ')"
          echo "cargo: $(cargo -V)"

      - name: "[install] pnpm install (root workspace, frozen)"
        run: pnpm install --frozen-lockfile

      # Build the Rust DB addon natively for THIS OS and stage zcode_db.node into
      # bundled-agents/<host>/glm. Two jobs in one: (a) it satisfies src-tauri/build.rs's
      # bundle.resources glob (otherwise `test:tauri:rust` build.rs aborts, exit 101), and
      # (b) it produces the .node the addon --check + services tests load. cargo builds rusqlite
      # (bundled) with MSVC on Windows / gcc on Linux.
      - name: "[db] build + stage native addon for this host (satisfies build.rs glob)"
        run: node packages/desktop/scripts/dev-tauri-prepare.mjs

      # src-tauri's build.rs (tauri_build) hard-requires the externalBin sidecar file to exist even
      # for `cargo test`, and binaries/ is gitignored. Build it here so `test:tauri:rust` compiles.
      # build.sh emits zcode-echo-<triple> (+ .exe on Windows), satisfying the per-OS check.
      - name: "[sidecar] build zcode-echo (build.rs externalBin existence check)"
        run: bash packages/desktop/tauri-port/sidecar/build.sh

      - name: "[test] run every check + test, aggregate ALL failures into one report"
        run: |
          set +e
          RESULTS="${RUNNER_TEMP}/results.md"
          : > "$RESULTS"
          HARD_FAILED=0

          run() {
            local gate="$1" label="$2"; shift 2
            echo; echo "########## [$label] ($gate) ##########"
            if bash -c "$*"; then
              status="PASS"
            else
              rc=$?; status="FAIL(exit=$rc)"
              [ "$gate" = "hard" ] && HARD_FAILED=1
            fi
            echo "----- [$label] -> $status"
            echo "| $label | $gate | $status |" >> "$RESULTS"
          }

          echo "| check | gate | result |" >> "$RESULTS"
          echo "|---|---|---|" >> "$RESULTS"

          # ---- HARD gates (must pass; a failure fails the job) ----
          run hard "typecheck"                 "pnpm typecheck"
          run hard "tauri layer-a"             "pnpm test:tauri:layer-a"
          run hard "tauri layer-b"             "pnpm test:tauri:layer-b"
          run hard "tauri rust (src-tauri)"    "pnpm test:tauri:rust"
          run hard "db cargo test --lib"       "cd packages/desktop/zcode-db && cargo test --lib ${VERBOSE_FLAG}"
          run hard "db addon --check"          "node packages/desktop/scripts/prepare-zcode-db-native.mjs --check"
          # Rust terminal addon: crate tests + loadable --check, and the permanent "0 JS fallback"
          # guard. The terminal backend is 100% Rust (portable-pty); node-pty must never reappear
          # in product src (it survives only as a root devDependency for the packaged-CLI TTY smoke test).
          run hard "pty cargo test --lib"      "cd packages/desktop/zcode-pty && cargo test --lib ${VERBOSE_FLAG}"
          run hard "pty addon --check"         "node packages/desktop/scripts/prepare-zcode-pty-native.mjs --check"
          run hard "0 node-pty fallback guard" "! grep -rnE 'node-pty' packages/services/src packages/server/src packages/zcode-server-cli/src packages/shared/src"
          # Services unit tests are not wired to a repo script; run via tsx. They pass (module
          # resolution + addon available via the dev-tauri-prepare staging above). Reported as
          # advisory so a future env quirk never blocks the platform signal. The packages/ui tests
          # are intentionally NOT run: they need the `@/` tsconfig path alias + a DOM env and cannot
          # execute under bare `tsx --test` (ERR_MODULE_NOT_FOUND '@/lib').
          run soft "services tests (tsx)"      "pnpm exec tsx --test packages/services/test/*.test.ts"

          # ---- ADVISORY checks (reported, do not fail the job) ----
          # BLOCKER — lint/fmt:check are still advisory ONLY because they are RED, and promoting
          # them now would turn every push red. Measured on this branch (3423 files, ~0.7s):
          #   pnpm lint      -> 99 warnings, 74 ERRORS. All 74 are eslint(max-lines) in
          #                      apps/zcode-cli, which .oxlintrc.json used to ignore wholesale.
          #                      apps/zcode-cli is FIRST-PARTY (1217 TS files / 264K LOC) and is no
          #                      longer ignored, so its 400-line violations are now visible for the
          #                      first time. Fix = split those files or add scoped max-lines overrides.
          #   pnpm fmt:check -> 3 files unformatted (renderer/src/css.d.ts,
          #                      renderer/src/tauriPlatformFactory.ts, tauri-port/test/layer-b/
          # ---- HARD gates: repo-wide static quality ----
          # lint / fmt:check / architecture:check are now `run hard`. They were advisory only
          # because they were RED, and being advisory is exactly how the original .qoder lint
          # blow-up (a 23GB scratch worktree being scanned on every run) went unnoticed for so
          # long. Both are green as of the fix that removed that blow-up:
          #   pnpm lint      -> 99 warnings, 0 errors, 3423 files, ~0.3s (was 1183 warn / 66 err /
          #                      53414 files / 107s).
          #   pnpm fmt:check -> all files correctly formatted.
          #   pnpm architecture:check -> 0 violations.
          # The 99 remaining warnings are deliberately non-blocking (no-unused-vars in
          # apps/zcode-cli etc.); if a rule is promoted from warning to error, this gate goes red
          # and that is the intended signal, not a flake.
          run hard "lint (oxlint)"             "pnpm lint"
          run hard "fmt:check (oxfmt)"         "pnpm fmt:check"
          run hard "architecture:check"        "pnpm architecture:check"
          # clippy stays advisory: it needs the full cargo dep graph and is slow, so an env-only
          # failure should not mask the platform build signal.
          run soft "db clippy -D warnings"     "cd packages/desktop/zcode-db && cargo clippy --all-targets -- -D warnings"
          run soft "pty clippy -D warnings"    "cd packages/desktop/zcode-pty && cargo clippy --all-targets -- -D warnings"
          # NOTE: `pnpm knip` is intentionally NOT run here. The repo's knip.json is an unfinished
          # baseline (only 4 workspaces declare entry points), so on a clean checkout it reports
          # ~454 "unused exports" (cross-package barrel re-exports) and flags genuinely-used deps it
          # can't statically see (optional native @lydell/node-pty-*, @opentelemetry/*, host-only
          # undici/ssh2/node-forge). That is tool misconfiguration, not a code defect, and it is
          # orthogonal to this workflow's job (per-platform build/test). Re-add it once knip.json has
          # per-workspace entries + ignoreDependencies for the native/optional packages.

          echo
          echo "==================== ${{ matrix.label }} SUMMARY ===================="
          cat "$RESULTS"
          echo "=============================================================="
          # Publish the table to the run's Job Summary.
          { echo "## ${{ matrix.label }} — check/test results"; echo; cat "$RESULTS"; } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HARD_FAILED" -ne 0 ]; then
            echo "::error::One or more HARD checks failed on ${{ matrix.label }} (see table above)"
            exit 1
          fi
          echo "All HARD checks passed on ${{ matrix.label }} (advisory failures, if any, are in the table)."

  # ---------------------------------------------------------------------------
  # 2. Real per-OS app bundle. Linux also emits an AppImage. Independent of `test`
  #    so build failures surface even when a test failed (and vice-versa).
  # ---------------------------------------------------------------------------
  build:
    name: build + bundle (${{ matrix.label }})
    # Skip the heavy per-OS bundle on pull_request; run it on `push` always, and on a manual
    # dispatch only when run_build is ticked (boolean input → compare to true, not 'true').
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_build == true)
    needs: []
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-24.04
            bundles: appimage
            portable: false
            bundle_glob: packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            artifact_name: zcode-appimage-linux-x64
          # Portable Windows build: NO installer. `tauri build --no-bundle` leaves the bare cargo
          # exe in target/release, and tauri-utils resolves resource_dir() to THE EXE'S OWN DIRECTORY
          # on Windows (tauri-utils/src/platform.rs: `if cfg!(target_os = "windows") { return exe_dir }`),
          # so the folder the user double-clicks is ZCode.exe + host/ beside it. Needs no Authenticode
          # certificate, which is the only reason Windows was previously excluded from this matrix.
          # bundle_glob is a DIRECTORY here; upload-artifact zips it with POSIX separators.
          - label: windows-x64-portable
            os: windows-latest
            bundles: ""
            portable: true
            bundle_glob: packages/desktop/zcode-portable-win-x64
            artifact_name: zcode-portable-win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: "[linux] install Tauri/WebKitGTK + AppImage build deps"
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_TAURI_DEPS

      - name: "[install] pnpm install (root workspace, frozen)"
        run: pnpm install --frozen-lockfile

      # addon + bundled-agents/<host>/glm/zcode_db.node (build.rs resources glob).
      - name: "[db] build + stage native addon for this host"
        run: node packages/desktop/scripts/dev-tauri-prepare.mjs

      # src-tauri/binaries/ is gitignored; the bundler aborts on a missing externalBin
      # (bundle.externalBin = ["binaries/zcode-echo"]) unless we build it. Emits
      # zcode-echo-<rust-target-triple> with the exec bit + a commonjs package.json pin.
      - name: "[sidecar] build zcode-echo externalBin (gitignored, bundler needs it)"
        run: bash packages/desktop/tauri-port/sidecar/build.sh

      - name: "[frontend] build host/scheduler (tsup) + renderer (vite -> out/renderer)"
        run: pnpm --filter @zcode/desktop build

      # Regression guard for the exact bug that shipped a broken AppImage: `yazl` was a declared
      # dependency, so tsup externalized it by default, but RUNTIME_EXTERNALS (the packager's
      # copy allowlist) never listed it — so the packaged Host died on boot with
      # ERR_MODULE_NOT_FOUND. The build itself succeeded, which is exactly why nothing caught it.
      # This compares the built bundle's bare imports against the allowlist and fails the job.
      - name: "[host-sidecar] verify every bundle import is vendored"
        working-directory: packages/desktop
        run: node scripts/prepare-zcode-host-sidecar.mjs --check

      # Build the Agent bundle (apps/zcode-cli/.../dist/zcode.cjs) that the packaged Host runs for
      # storage-prep + sessions. prepare-zcode-host-sidecar.mjs vendors it into resources/host/agent.
      - name: "[agent] build bundled Agent (zcode.cjs)"
        run: node scripts/build-desktop-agent-cli.mjs

      # Package the Local Host as a self-contained sidecar (bundled node + ESM host + the RUST
      # zcode_db.node DB addon and zcode_pty.node terminal addon) into src-tauri/resources/host, so
      # the packaged app can boot its real backend instead of the echo PoC. DB + terminal both stay
      # Rust (loaded via ZCODE_DB_NATIVE / ZCODE_PTY_NATIVE; no JS node-pty path).
      - name: "[host-sidecar] stage packaged Local Host (bundled node + Rust DB + PTY addons)"
        working-directory: packages/desktop
        run: node scripts/prepare-zcode-host-sidecar.mjs

      # Headless proof the staged sidecar boots + opens the DB via the Rust addon (no GUI needed):
      # it must print ZCODE_WS_READY <port>. continue-on-error so a runner quirk can't turn a
      # green build red; the value is surfacing whether the packaged backend contract holds per OS.
      - name: "[host-sidecar] headless boot proof (bundled node + Rust addon -> ZCODE_WS_READY)"
        # HARD gate, deliberately. This used to be `continue-on-error: true`, which is how an AppImage
        # whose Host died on boot shipped TWICE while the job reported success:
        #   FAIL: no ZCODE_WS_READY
        #   standalone host failed to start: Error: Storage preparation failed: open_failed
        #   ##[error]Process completed with exit code 1.        <- printed, then ignored
        # This is the ONLY step that proves the packaged Host actually boots. Without it, every other
        # step (bundle, import-vendoring, version guard) passes happily on an app that cannot start.
        # Do NOT re-add continue-on-error without also fixing whatever it is hiding.
        working-directory: packages/desktop/src-tauri/resources/host
        run: |
          set -uo pipefail
          OUT=/tmp/hostboot.out
          # Git Bash on Windows has /tmp, but the staged runtime is node.exe there, so pick whichever
          # name actually exists instead of hardcoding ./node (which only ever ran on Linux/macOS).
          if [ -f ./node ]; then NODE_BIN=./node; else NODE_BIN=./node.exe; fi
          if [ ! -f "$NODE_BIN" ]; then
            echo "::error::neither ./node nor ./node.exe is staged in resources/host"; ls -la; exit 1
          fi
          ZCODE_HOST_WS=1 ZCODE_WS_PORT=0 \
            ZCODE_DB_NATIVE="$PWD/zcode_db.node" \
            ZCODE_PTY_NATIVE="$PWD/zcode_pty.node" \
            ZCODE_BUNDLED_AGENT_ENTRY="$PWD/agent/zcode.cjs" \
            "$NODE_BIN" standalone.js >"$OUT" 2>/tmp/hostboot.err &
          PID=$!
          for _ in $(seq 1 30); do grep -q ZCODE_WS_READY "$OUT" && break; sleep 1; done
          kill "$PID" 2>/dev/null || true
          if grep -q ZCODE_WS_READY "$OUT"; then
            echo "OK: packaged host sidecar booted headlessly with the Rust DB addon"; exit 0
          fi
          echo "FAIL: no ZCODE_WS_READY"; tail -20 /tmp/hostboot.err; exit 1

      # bundle.active:false in the dev config would skip bundling, and the host resource dir is
      # only shipped here (not the base config) so dev/`test:tauri:rust` never require it.
      - name: "[bundle] verify tauri.prod.json version tracks the root package.json"
        working-directory: packages/desktop
        # No version-sync script exists in this repo and release-it does not touch the Tauri
        # config, so a hardcoded bundle version drifts silently on the next release. Fail loudly
        # instead: if this trips, bump tauri.prod.json to match package.json (or teach a script to
        # do it) — do NOT delete the check.
        run: |
          set -euo pipefail
          root_version="$(node -p "require('../../package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.prod.json').version")"
          if [ "$root_version" != "$tauri_version" ]; then
            echo "::error::version drift: package.json=$root_version tauri.prod.json=$tauri_version"
            exit 1
          fi
          echo "version in sync: $root_version"

      - name: "[bundle] tauri build (${{ matrix.bundles }})"
        working-directory: packages/desktop
        # `bundle.active:false` in the dev config would skip bundling, and the host resource dir is
        # only shipped here (not the base config) so dev/`test:tauri:rust` never require it. The
        # overlay also supplies the PRODUCTION identity — without it the bundle was named
        # "ZCode (Tauri dev)_0.0.0_amd64.AppImage" and carried a `.dev` bundle identifier.
        # `tauri.prod.json` is the single source of that overlay; `pnpm tauri:build` uses the same
        # file so a local release build is byte-comparable in identity to CI.
        run: |
          if [ "${{ matrix.portable }}" = "true" ]; then
            # Portable build: produce the bare exe; the resources are assembled next to it by the
            # "[portable] assemble…" step, which then asserts the exact layout the shell resolves.
            pnpm exec tauri build --config src-tauri/tauri.prod.json --no-bundle
          else
            pnpm exec tauri build \
              --config src-tauri/tauri.prod.json \
              --bundles ${{ matrix.bundles }}
          fi

      # 这一步是整个 portable 交付的核心保障：它把 src-tauri/src/commands.rs 里
      # spawn_host_discover_port 的运行时存在性检查（resolve("host", BaseDirectory::Resource)
      # 之后逐个 path.exists()）在 CI 里原样复现一遍。命令式检查列表必须与那段 Rust 保持一致——
      # 少了任何一项，用户双击时得到的就是启动失败，而不是 CI 报错。
      # host/ 若没被 tauri 放到 exe 同级目录，就从 resources/host 复制一份（幂等）。
      - name: "[portable] assemble the double-click folder + verify the runtime layout"
        if: matrix.portable
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          # --no-bundle 产出的是 cargo 的裸 exe（名字取自 Cargo.toml 的 package name），
          # productName 的 "ZCode" 只在 bundle 阶段才会重命名，所以这里不能硬编码 ZCode.exe。
          pkg_name="$(sed -n '/^\[package\]/,/^\[/p' src-tauri/Cargo.toml | grep -m1 '^name' | cut -d'"' -f2)"
          built_exe="src-tauri/target/release/${pkg_name}.exe"
          if [ ! -f "$built_exe" ]; then
            echo "::error::--no-bundle did not produce $built_exe"
            ls -la src-tauri/target/release | head -30
            exit 1
          fi
          echo "built exe: $built_exe"
          if [ ! -d src-tauri/target/release/host ]; then
            echo "::error::tauri did not stage resources beside the exe (expected target/release/host)"
            echo "on Windows resource_dir() == the exe directory, so host/ must sit next to the exe"
            ls -la src-tauri/target/release | head -30
            exit 1
          fi
          out=zcode-portable-win-x64
          rm -rf "$out" "$out.zip"
          mkdir -p "$out"
          # 面向用户改名成 productName，双击看到的就是 ZCode.exe。
          # resource_dir 只依赖 exe 所在目录、不依赖 exe 文件名，所以改名是安全的。
          cp "$built_exe" "$out/ZCode.exe"
          cp -a src-tauri/target/release/host "$out/host"
          # glm/ yahan jaan-boojh kar NAHI daala: wo build.rs ke resources glob ko satisfy karne ke
          # liye maujood hai, runtime usse resolve nahi karta (src-tauri/src aur services mein koi
          # "glm/zcode_db" reference nahi), aur headless boot proof bhi bin glm ke pass hua tha.
          # Mirror commands.rs:2763-2778 (node/entry/addon/pty_addon/agent_entry/provider_release).
          missing=0
          for f in node.exe standalone.js zcode_db.node zcode_pty.node agent/zcode.cjs provider/zcode-builtin.json; do
            if [ -e "$out/host/$f" ]; then
              echo "  OK   host/$f"
            else
              echo "  MISSING host/$f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::portable folder is incomplete — ZCode.exe would fail at spawn_host_discover_port"
            find "$out/host" -maxdepth 2 | head -30
            exit 1
          fi
          # Zip manually MATI karo: PowerShell ka Compress-Archive entry naam mein '\' daalta hai,
          # jo ZIP spec (APPNOTE 4.4.17, path separator = '/') ke khilaf hai aur extract par toota
          # hua tree deta hai. Foldar upload karte hain; actions/upload-artifact khud POSIX
          # separators ke saath archive banata hai (Linux artifact isi raaste se aaya tha).
          echo "portable folder contents:"
          find "$out" -maxdepth 1 -printf '%y %p\n' 2>/dev/null | sort | head -10
          du -sh "$out"
          echo "Portable Windows build assembled + verified: ZCode.exe with host/ beside it (all 6 required files)"

      # Tauri/linuxdeploy bundles libcrypto.so.3 (the build host's OpenSSL) into the AppImage and
      # force-prepends it to LD_LIBRARY_PATH, so anything the app spawns (git/eza/openssl) loads the
      # older libcrypto and fails with `version 'OPENSSL_3.6.0' not found`. The strip tool removes
      # that shadowing library (behind a host-superset safety gate) and repacks in place.
      # `appimagetool` ships its own runtime+mksquashfs; extract-and-run avoids needing libfuse2 on
      # the runner. The tool is Rust (crate `zcode-appimage-strip`), not JS.
      - name: "[appimage] install appimagetool (pinned) + squashfs tools"
        if: matrix.bundles == 'appimage'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends squashfs-tools zstd
          curl -fsSL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o /usr/local/bin/appimagetool
          # Pin by hash: the `continuous` tag's asset moves, so the checksum is what actually pins it.
          echo "95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6  /usr/local/bin/appimagetool" | sha256sum -c -
          chmod +x /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 /usr/local/bin/appimagetool --version

      - name: "[appimage] build the strip tool (Rust)"
        if: matrix.bundles == 'appimage'
        working-directory: packages/desktop
        run: cargo build --release --manifest-path zcode-appimage-strip/Cargo.toml

      - name: "[appimage] strip shadowing system libs (repack in place)"
        if: matrix.bundles == 'appimage'
        working-directory: packages/desktop
        run: zcode-appimage-strip/target/release/zcode-appimage-strip

      - name: "[appimage] verify stripped AppImage (libs gone, host sidecar intact)"
        if: matrix.bundles == 'appimage'
        working-directory: packages/desktop
        run: zcode-appimage-strip/target/release/zcode-appimage-strip --check

      - name: "[bundle] list produced artifacts"
        if: always()
        working-directory: packages/desktop
        run: find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.msi' -o -name '*.deb' -o -name '*.dmg' \) 2>/dev/null || echo "no bundle files found"

      - name: "[upload] ${{ matrix.artifact_name }}"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_glob }}
          # error, not warn: a green build with no downloadable artifact is exactly the
          # silent-failure shape this repo has already been bitten by once.
          if-no-files-found: error
