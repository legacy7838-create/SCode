[package]
name = "zcode-appimage-strip"
version = "0.0.0"
edition = "2021"
description = "ZCode Linux AppImage post-bundle fix, ported to Rust: strip shadowing system libs and repack. Replaces scripts/strip-appimage-system-libs.mjs with zero JS."
publish = false

[lib]
# rlib so the parsers and the safety gate are unit-testable without spawning a process; the
# [[bin]] is the CLI the build pipeline invokes.
crate-type = ["rlib"]

[[bin]]
name = "zcode-appimage-strip"
path = "src/main.rs"

[dependencies]
# thiserror for the typed library error; anyhow for context at the bin boundary.
thiserror = "1"
anyhow = "1"
# TempDir gives RAII cleanup of the extract dir, replacing the JS `finally` + rmSync.
tempfile = "3"

[profile.release]
# The binary is build tooling, not a shipped artifact: no need to fat-strip LTO.
strip = true
