[package]
name = "zcode-desktop-tauri"
version = "0.0.0"
description = "ZCode desktop shell (Tauri v2 port) — parallel to Electron, NOT yet feature-complete"
edition = "2021"
rust-version = "1.77"

# Standalone crate for the Tauri shell. Electron remains the shipped product until
# parity is verified (see ../PORTING.md). Do not wire into the Electron build.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Direct dependency (also pulled transitively by tauri) so the `get_platform_info` command can
# derive `serde::Serialize` on its return struct.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform OS locale probe for the `get_system_locale` command (Phase 2 slice).
sys-locale = "0.3"
# Native file/save/message dialogs for the `show_*_dialog` commands (Phase 2 slice 5).
tauri-plugin-dialog = "2"
# Open URLs / filesystem paths and reveal items in the OS file manager for the slice-6 shell
# commands (`open_url` / `open_path` / `reveal_in_folder`) via `tauri_plugin_opener::OpenerExt`.
tauri-plugin-opener = "2"
# Native OS notifications for the slice-7 `show_notification` command via
# `tauri_plugin_notification::NotificationExt` (`app.notification()`).
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
