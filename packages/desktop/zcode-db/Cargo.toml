[package]
name = "zcode-db"
version = "0.0.0"
edition = "2021"
description = "ZCode SQLite data layer, ported to Rust (rusqlite). Vertical-slice scaffold."

[lib]
# cdylib => produces a loadable Node-API addon (.node).
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zcode-db-read"
path = "src/main.rs"

[dependencies]
# bundled = compile SQLite's C from source so the crate is self-contained (no system libsqlite3).
rusqlite = { version = "0.32", features = ["bundled"] }
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
percent-encoding = "2"
cron = "0.17.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
uuid = { version = "1.27.0", features = ["v4"] }

[build-dependencies]
napi-build = "2"
