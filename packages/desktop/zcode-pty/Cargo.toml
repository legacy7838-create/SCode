[package]
name = "zcode-pty"
version = "0.0.0"
edition = "2021"
description = "ZCode integrated-terminal backend, ported to Rust (portable-pty). Replaces node-pty with zero JS PTY fallback."

[lib]
# cdylib => produces a loadable Node-API addon (.node), mirroring packages/desktop/zcode-db.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Single cross-platform PTY engine (wezterm-origin, MIT): native ConPTY on Windows,
# in-process forkpty on unix/macOS. This is what lets us drop node-pty, its external
# spawn-helper binary, and the conpty.dll load-fallback dance entirely.
portable-pty = "0.8"
# napi4 is required for ThreadsafeFunction, which is how the PTY reader/exit threads
# push output bytes and the exit code back into the JS Emitter on the main thread.
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
once_cell = "1"
# Used only for the homedir() fallback in cwd resolution, to match node's os.homedir().
home = "0.5"

[build-dependencies]
napi-build = "2"
