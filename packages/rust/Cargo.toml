[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
# `preserve_order` is REQUIRED for RPC wire compatibility, not a preference.
# The TS side uses `JSON.stringify`, which emits object keys in insertion order;
# serde_json's default `Map` is a BTreeMap and would emit them sorted. That
# changes the bytes on the wire for every object argument and response, and any
# byte-level consumer (checksums, snapshot tests, strict clients) would see a
# different payload for the same logical value.
serde_json = { version = "1", features = ["preserve_order"] }
# zcode-codec hot byte primitives must beat the platform's own (Node's `Buffer.toString("base64")`
# and the previous hand-rolled CRC32), so the compute is delegated to the optimized crates:
# base64 0.23 ships AVX2/AVX-512 encode+decode behind its default `simd-unsafe` feature, and
# crc32fast uses the x86-64 CRC32 instruction (SSE4.2/PCLMULQDQ) via a 16-way slicing-by-8 loop.
base64 = "0.23"
crc32fast = "1.5"
# zcode-events (docs/specs/rust-native-events.md): rusqlite bundled avoids a system-SQLite dependency;
# sha2 matches migration checksums computed as createHash("sha256") of trimmed SQL (migration-runner.ts:296-298).
# `backup` adds SQLite's Online Backup API, which zcode-chrome-cookies uses to snapshot Chrome's own
# Cookies database (the last node:sqlite user in the repo, packages/desktop/src/main/chromeCookieManager.ts).
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sha2 = "0.10"
# zcode-markdown: inline tokenization of independent blocks is data-parallel, so
# rayon maps it over the libuv worker pool instead of lexing blocks serially.
rayon = "1"
# zcode-cron (docs/specs/rust-native-cron.md): `clock` supplies `Local`, which is what the legacy
# `Date` local getters and `new Date(y, m, d, h, min)` constructions mean. No timezone parameter is
# exposed — the schedule belongs to the host, and two callers in one process must not be able to
# disagree (spec invariant 4).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Replaces the `croner` npm dependency for the raw 5-field expression path. A different engine, so
# the parity burden is real and is discharged by the differential corpus in the spec (§6.2).
cron = "0.15"
# zcode-url-guard: URL parsing for the Coding Plan navigation and payment-callback
# allowlists. Already vendored transitively by the Tauri tree (url 2.5.8), so this pins an
# existing version. Hand-rolling WHATWG URL semantics for a security decision is not
# acceptable — docs/specs/rust-native-url-guard.md §3.3.
url = "2"
# zcode-fs (docs/specs/rust-native-fs.md): Gitignore-spec 2.22 matching. Hand-writing
# gitignore parsing is forbidden by the ported workspaceFileIgnore.ts:16-20, which names
# the npm `ignore` package as the reference implementation; this is its Rust counterpart
# (same spec, same author), so the rules behave identically.
#
# NOTE: `mime_guess` was staged for this port and then deliberately REJECTED. The
# predecessor's inferMediaTypeFromPath is a closed three-step extension table, and
# mime_guess disagrees with it (audio/ogg for .opus, text/plain for .ts). Reproducing
# the table verbatim is invariant 3 compliance; matching a general-purpose crate is a
# behavior fork. See docs/specs/rust-native-fs.md §3.7 / R9.
ignore = "0.4.33"
# zcode-sysinfo (docs/specs/rust-native-sysinfo.md): cross-platform host + process
# introspection. Chosen over hand-rolled per-OS syscalls because Windows is a supported
# release target and per-OS code there is the maintenance hazard.
sysinfo = "0"

[profile.release]
lto = "thin"
strip = "symbols"

# Dev-profile debug info. Cargo's default is `debug = true` (full DWARF), and
# this workspace's dependency tree is large enough that the generated `.rlib`
# debug sections dominate `target/` — measured 2026-10-01 at 36 GB for
# `apps/zcode-tauri/src-tauri/target/debug` alone. Line tables keep panics and
# backtraces pointing at the right source line, which is what a dev build is
# actually for, while dropping the bulk of the payload. Release already strips.
[profile.dev]
debug = "line-tables-only"
