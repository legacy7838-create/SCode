[package]
name = "zcode-markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true, features = ["serde-json"] }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# JS-semantics regex engine: the marked 17.0.1 grammar uses lookarounds and
# backreferences, so `regex` alone cannot host it byte-for-byte.
fancy-regex = "0.14"
# parking-lot rule: lock() returns the guard directly — no poisoning path.
parking_lot = "0.12"
# data-parallel inline tokenization across independent blocks (independent,
# order-preserving collect) — see docs/specs/rust-native-markdown.md.
rayon = { workspace = true }
