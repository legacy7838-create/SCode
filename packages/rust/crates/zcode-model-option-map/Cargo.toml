[package]
name = "zcode-model-option-map"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Restricted-CEL option map compiler/evaluator. Pure Rust port of packages/model-option-map so provider config validation runs without Node. See docs/specs/rust-native-server.md rung 3."

[lib]
# `cdylib` for the Node binding, `rlib` for `zcode-provider-config` (the native
# host validates CEL maps through the same crate). The napi feature is optional
# so a host that only links the rlib does not pull the Node ABI — the same
# shape `zcode-codec` uses.
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
