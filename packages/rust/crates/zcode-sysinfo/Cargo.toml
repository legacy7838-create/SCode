[package]
name = "zcode-sysinfo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Host and process introspection: the machine-wide process resource table and its CPU-time sampler."

[lib]
# cdylib — the napi `.node` that Node entrypoints load via `loadNative()`.
# rlib   — lets `tests/` link the pure logic directly; the reader and the sampler are
#          plain Rust, so the differential corpus exercises them without a Node
#          runtime in the loop.
crate-type = ["cdylib", "rlib"]

[features]
# Exposes internals for the example probe and the integration tests.
test-hooks = []

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Cross-platform process table. Chosen over hand-rolled per-OS syscalls because
# Windows is a supported release target (docs/specs/rust-native-program.md R3).
# Scope note: `sysinfo` serves macOS and Windows only. Linux is served by the
# hand-rolled `/proc` reader in src/linux.rs, for the two measured reasons in
# spec §3.3; the process identity token keeps its TypeScript implementation (§3.2).
sysinfo = { workspace = true }
# The per-PID procfs reads are syscall-bound, and the predecessor issued them as
# `Promise.all` over `readFile`, i.e. across the 4-thread libuv pool. A serial Rust
# reader measured 6.68 ms for 267 PIDs — slower than the TypeScript it replaces.
# Across the rayon pool the same read is 1.20 ms (spec §7).
rayon = { workspace = true }
