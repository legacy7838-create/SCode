[package]
name = "zcode-tauri"
version = "3.14.3"
description = "ZCode Desktop App (Tauri port)"
authors = ["ZCode"]
edition = "2021"
rust-version = "1.82"

[lib]
# Tauri v2 keeps the app in a library so the mobile entrypoints can reuse it.
name = "zcode_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The in-process channel RPC server. Serves the UI's `IServiceAccessor` natively
# so the Node `@zcode/server` process can be retired service by service. Pulled
# in with default features (which include the `websocket` network edge).
zcode-rpc-server = { path = "../../../packages/rust/crates/zcode-rpc-server" }
# Automation schedule computation. A Tauri process is not Node and cannot `require()` a
# `.node`, so the crate is linked as an rlib rather than loaded at runtime — the same reason
# `zcode-rpc-server` is a plain path dependency. Without it the scheduler had no way to
# compute a next run and passed `None` for every misfire skip, which left a recurring
# automation re-claimed as a misfire on every 20 s tick and never rescheduled.
# See docs/specs/rust-native-cron.md.
zcode-cron = { path = "../../../packages/rust/crates/zcode-cron" }
# MCP user-directory configuration: read, merge, migrate and atomically write the user's
# server config. rlib-only, for the same reason. Replaces 751 lines of Electron-main
# TypeScript that the Tauri host could not serve. See docs/specs/rust-native-mcp-config.md.
zcode-mcp-config = { path = "../../../packages/rust/crates/zcode-mcp-config" }
# External-navigation and payment-callback allowlists. In Electron these read
# event.senderFrame.url, which is unforgeable; Tauri has no equivalent, so the decision is
# resolved here instead of above a renderer-supplied URL (PORT_STATUS.md:161).
# See docs/specs/rust-native-url-guard.md.
zcode-url-guard = { path = "../../../packages/rust/crates/zcode-url-guard" }
# Task index sqlite read: `onboarding-record` checks `listTaskMetas` for
# `shouldOnboard` (existing_local_task decision). rlib, same reason as zcode-cron —
# the crate is already the schema owner (scheduler_store.rs cites its AUTOMATION_SCHEMA),
# so the host links it instead of duplicating SQL.
zcode-task-index = { path = "../../../packages/rust/crates/zcode-task-index" }
zcode-private-file = { path = "../../../packages/rust/crates/zcode-private-file" }
# Provider config runtime (built-in + personal provider/model settings) for the
# `provider-settings` and `model-selection` channels. rlib for the same reason as
# zcode-rpc-server — the Tauri host links it and serves the channels in-process.
# See docs/specs/rust-native-server.md rung 3.
zcode-provider-config = { path = "../../../packages/rust/crates/zcode-provider-config" }
zcode-fs = { path = "../../../packages/rust/crates/zcode-fs" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
urlencoding = "2"
parking_lot = "0.12"
# Base64 for binary payloads: Tauri's JSON transport turns an `ArrayBuffer` into
# `{}` (`JSON.stringify(new ArrayBuffer(8))`), so file bytes ride as a base64
# string instead. Keep this in sync with the TS side.
base64 = "0.22"
# Scheduler persistence: the Electron scheduler claimed `automations` and
# `off_peak_tasks` rows directly. Bundled sqlite keeps the storage layer
# independent of the host system libsqlite.
# Must stay on the same major as packages/rust (0.37): two libsqlite3-sys versions
# both claim `links = "sqlite3"` and cargo refuses the graph (zcode-task-index dep).
rusqlite = { version = "0.37", features = ["bundled"] }

# Already in the lock file (pulled in by the Tauri plugin tree); listed directly
# because the ported `system` channel performs HTTP service probes. `rustls` is
# pure Rust, so this adds no system OpenSSL dependency.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "http2"] }
# Credential storage reproduces the existing AES-256-GCM cipher byte for byte, so
# secrets written by the Node build stay readable. `sha2`, `base64` and `rand` are
# already in the lock file via the plugin tree; only the AEAD is new.
aes-gcm = "0.10"
# Terminal pty spawn for the Tauri host (apps/zcode-tauri/CUTOVER_SPEC.md §3 A3).
# A Tauri process is not Node, so it cannot load the node-pty prebuild the Electron host
# used. portable-pty is the cross-platform replacement because it wraps ConPTY on Windows,
# forkpty on macOS and openpty on Linux behind one API — which matters when the release
# matrix is six targets and cross-compilation is still a known gap (CUTOVER_SPEC R4).
portable-pty = "0.8"
# Desktop notification replacement for A4. The Tauri notification plugin returns no
# handle, so same-tag replacement (which Electron had via the notification `tag`) has to
# be tracked in-process to stay reproducible.
notify-rust = "4"
crossbeam-channel = "0.5"
# Cross-platform file watching for the `file-watcher` channel. std has no
# stable watch API; notify wraps inotify/FSEvents/ReadDirectoryChanges behind
# one callback. Non-recursive is what the renderer actually uses
# (`useWatchedReaddir` watches a single directory).
notify = "6"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Enabled by `tauri build`; keeps devtools out of release bundles.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# NOTE: `panic = "abort"` is deliberately NOT set. With abort, a panic in any
# supervised task kills the whole process, which would make `Supervisor`'s
# backoff and per-child restart unreachable. Unwinding is what makes crash
# recovery work; see src/supervisor/mod.rs.
strip = true

# Dev-profile debug info. Cargo defaults to full DWARF, which is what made
# `target/debug` the single largest directory in the tree — 36 GB measured
# 2026-10-01. `line-tables-only` keeps usable backtraces (the dev loop's actual
# need) and is a cache the user can delete with `cargo clean`, not an output.
[profile.dev]
debug = "line-tables-only"
